[package]
name = "tuc"
version = "0.2.0"
edition = "2021"
description = "Tool Update Collector - 登録したコマンドをまとめて実行するTUIツール"
license = "MIT"
repository = "https://github.com/koukemo/ToolUpdateCollector"
readme = "README.md"
exclude = ["about.toml", "about.hbs"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true

[package.metadata.deb]
maintainer = "koukemo"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = "tuc は apt / brew / claude などの更新コマンドを登録し、TUI からまとめて実行するツールです。"
assets = [
    ["target/release/tuc", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/tuc/README.md", "644"],
    ["LICENSE", "usr/share/doc/tuc/LICENSE", "644"],
    ["THIRD_PARTY_LICENSES.txt", "usr/share/doc/tuc/THIRD_PARTY_LICENSES.txt", "644"],
]
