name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tuc.exe
        run: cargo build --release --locked
      # tuc update は tuc_<ver>_windows_x86_64.zip を探すので、この名前を崩さない
      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item target/release/tuc.exe, README.md, LICENSE, THIRD_PARTY_LICENSES.txt dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/tuc_${ver}_windows_x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build tuc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tar.gz
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/pkg
          cp "target/$TARGET/release/tuc" README.md LICENSE THIRD_PARTY_LICENSES.txt dist/pkg/
          dist/pkg/tuc --version
          tar -czf "dist/tuc_${TAG#v}_macos_${ARCH}.tar.gz" -C dist/pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: [deb, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
