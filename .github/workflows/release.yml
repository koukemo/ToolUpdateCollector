name: release

on:
  push:
    tags: ["v*"]
  # 公開済みのリリースに MSI だけを追加する（タグのコードを、実行したブランチの wix/ でビルドする）
  workflow_dispatch:
    inputs:
      tag:
        description: "MSI を追加するリリースのタグ (例: v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  deb:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/debian/*.deb

  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tuc.exe
        run: cargo build --release --locked
      # tuc update は tuc_<ver>_windows_x86_64.zip を探すので、この名前を崩さない
      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist/pkg | Out-Null
          Copy-Item target/release/tuc.exe, README.md, LICENSE, THIRD_PARTY_LICENSES.txt dist/pkg/
          Compress-Archive -Path dist/pkg/* -DestinationPath "dist/tuc_${ver}_windows_x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build tuc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tar.gz
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/pkg
          cp "target/$TARGET/release/tuc" README.md LICENSE THIRD_PARTY_LICENSES.txt dist/pkg/
          dist/pkg/tuc --version
          tar -czf "dist/tuc_${TAG#v}_macos_${ARCH}.tar.gz" -C dist/pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  msi:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Use wix/ from the dispatching ref
        if: github.event_name == 'workflow_dispatch'
        run: git checkout ${{ github.sha }} -- wix
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WiX 3.14 and cargo-wix
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip -OutFile wix.zip
          Expand-Archive wix.zip $env:RUNNER_TEMP/wix
          cargo install cargo-wix --locked
      # tuc_<ver>_windows_x86_64.msi の形式を崩さない
      - name: Build MSI
        shell: pwsh
        run: |
          $ver = $env:TAG.TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo wix --nocapture -b "$env:RUNNER_TEMP/wix" -o "dist/tuc_${ver}_windows_x86_64.msi"
      - name: Upload to existing release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: gh release upload "$env:TAG" (Get-ChildItem dist/*.msi).FullName --clobber --repo ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi

  release:
    if: github.event_name == 'push'
    needs: [deb, windows, macos, msi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
